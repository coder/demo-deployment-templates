name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: No credentials in this public repository
        run: ./scripts/check-no-secrets.py
      - name: Lint user data
        run: ./scripts/check-user-data.py
      - name: Check seed files
        run: |
          pip install --quiet pyyaml
          ./scripts/check-seed.py
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          for dir in */; do
            [ -f "$dir/main.tf" ] || continue
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
